[project]
name = "glass-backend"
version = "0.1.0"
description = "Glass Backend - LLM Council API with MongoDB and Auth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "email-validator>=2.0.0",
    # MongoDB
    "motor>=3.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "python-multipart>=0.0.6",
    # Encryption for API keys
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

