version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - python3 -m pip install --upgrade pip
    build:
      - python3 -m pip install .
run:
  runtime-version: 3.11.11
  command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: APP_ENV
      value: production

    # AWS Configuration
    - name: AWS_REGION
      value: ap-south-1

    # OpenRouter API Configuration
    # - name: OPENROUTER_API_KEY   → secret

    # Encryption Configuration
    # - name: ENCRYPTION_KEY       → secret

    # Database Configuration
    # - name: MONGODB_URL          → secret
    - name: MONGODB_DB_NAME
      value: glass

    # JWT Configuration
    # - name: JWT_SECRET_KEY       → secret
    - name: JWT_ALGORITHM
      value: HS256
    - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
      value: '30'
    - name: JWT_REFRESH_TOKEN_EXPIRE_DAYS
      value: '7'

    # CORS Configuration
    - name: CORS_ORIGINS
      value: 'https://your-frontend-url.com' # TODO: Update with actual frontend URL

    # Debug Mode
    - name: DEBUG
      value: 'false'

    # SMTP Configuration (Waitlist/Demo emails)
    - name: SMTP_HOST
      value: smtpout.secureserver.net
    - name: SMTP_PORT
      value: '465'
    # - name: WAITLIST_EMAIL       → secret
    # - name: WAITLIST_PASS        → secret
    # - name: DEMO_EMAIL           → secret
    # - name: DEMO_PASS            → secret
    # - name: ADMIN_EMAIL          → secret
