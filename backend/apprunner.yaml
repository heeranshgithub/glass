version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - pip install --upgrade pip
    build:
      - pip install .
run:
  runtime-version: 3.11.11
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    # Application
    - name: DEBUG
      value: 'false'

    # AWS Configuration (for Secrets Manager)
    - name: AWS_REGION
      value: ap-south-1

    # Database
    - name: MONGODB_DB_NAME
      value: glass

    # JWT Configuration
    - name: JWT_ALGORITHM
      value: HS256
    - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
      value: '30'
    - name: JWT_REFRESH_TOKEN_EXPIRE_DAYS
      value: '7'

    # CORS / Frontend
    - name: CORS_ORIGINS
      value: 'https://your-frontend-url.com'  # TODO: Update with actual frontend URL

    # SMTP Configuration
    - name: SMTP_HOST
      value: smtpout.secureserver.net
    - name: SMTP_PORT
      value: '465'

    # Secrets — inject via App Runner secret references or AWS Secrets Manager
    # (set these in the App Runner console or via the --secrets flag in the CLI)
    # - name: MONGODB_URL        → secret
    # - name: JWT_SECRET_KEY     → secret
    # - name: ENCRYPTION_KEY     → secret
    # - name: WAITLIST_EMAIL     → secret
    # - name: WAITLIST_PASS      → secret
    # - name: DEMO_EMAIL         → secret
    # - name: DEMO_PASS          → secret
    # - name: ADMIN_EMAIL        → secret
