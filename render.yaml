services:
  - type: web
    name: glass-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: 'false'
      - key: MONGODB_DB_NAME
        value: llm_council
      # secrets (set in Render, not committed)
      - key: MONGODB_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WAITLIST_EMAIL
        sync: false
      - key: WAITLIST_PASS
        sync: false

  - type: web
    name: glass-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: '22.12.0'
      # IMPORTANT: backend has API_V1_PREFIX="" so use the backend origin (no /api/v1)
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: glass-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_ENV
        value: 'production'
